<style>
        body { font-family: 'Manrope', sans-serif; background-color: #faf5ee; }
        h1, h2, h3, h4, h5, h6 { font-family: 'EB Garamond', serif; }

        .option-card-hover:hover { border-color: #c2652a; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(194, 101, 42, 0.08); }
        .option-card-selected { border-color: #c2652a; background-color: rgba(194, 101, 42, 0.05); }
    </style>

<body class="bg-background text-on-background min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Nav Shell suppressed for transactional onboarding flow -->
<main class="flex-1 flex flex-col min-h-screen relative w-full">
<!-- Progress Bar Top -->
<div class="w-full h-1 bg-surface-variant fixed top-0 z-50">
<div class="h-full bg-primary transition-all duration-500 w-3/4"></div>
</div>
<!-- Decorative Background Elements -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-surface-tint opacity-[0.03] rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50%] h-[50%] bg-tertiary opacity-[0.02] rounded-full blur-3xl"></div>
</div>
<div class="flex-1 flex flex-col max-w-4xl mx-auto w-full px-6 py-12 md:py-20 relative z-10">
<!-- Header Section -->
<header class="mb-16 text-center max-w-2xl mx-auto">
<div class="inline-flex items-center space-x-2 text-surface-tint mb-6">
<span class="font-label text-sm font-semibold tracking-widest uppercase">Step 3 of 4</span>
<span class="w-8 h-px bg-surface-tint opacity-50"></span>
<span class="font-label text-sm font-semibold tracking-widest uppercase">Use Case</span>
</div>
<h1 class="font-headline text-4xl md:text-5xl font-medium tracking-tight text-on-surface mb-6 leading-tight">
                    What are you going to use this app for?
                </h1>
<p class="font-body text-on-surface-variant text-lg leading-relaxed">
                    Select the primary goal for your content strategy. We'll tailor the workspace and AI suggestions to this objective.
                </p>
</header>
<!-- Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16 flex-1 content-start">
<!-- Option 1 -->
<button class="group option-card-hover text-left bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-8 flex flex-col relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer" onclick="selectOption(this)" type="button">
<div class="absolute top-0 left-0 w-1 h-full bg-transparent group-hover:bg-primary transition-colors"></div>
<div class="flex items-center justify-between mb-6">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface group-hover:text-primary group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-2xl">campaign</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<div class="inner-dot w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</div>
<h3 class="font-headline text-2xl font-medium text-on-surface mb-3">Going Viral &amp; Entertainment</h3>
<p class="font-body text-on-surface-variant leading-relaxed text-sm">Focus on high-reach formats, trending audio, and rapid engagement loops to maximize visibility.</p>
</button>
<!-- Option 2 -->
<button class="group option-card-hover text-left bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-8 flex flex-col relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer" onclick="selectOption(this)" type="button">
<div class="absolute top-0 left-0 w-1 h-full bg-transparent group-hover:bg-primary transition-colors"></div>
<div class="flex items-center justify-between mb-6">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface group-hover:text-primary group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-2xl">military_tech</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<div class="inner-dot w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</div>
<h3 class="font-headline text-2xl font-medium text-on-surface mb-3">Building Authority &amp; Niche Growth</h3>
<p class="font-body text-on-surface-variant leading-relaxed text-sm">Create educational, deep-dive content to establish yourself as a thought leader in a specific domain.</p>
</button>
<!-- Option 3 -->
<button class="group option-card-hover text-left bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-8 flex flex-col relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer" onclick="selectOption(this)" type="button">
<div class="absolute top-0 left-0 w-1 h-full bg-transparent group-hover:bg-primary transition-colors"></div>
<div class="flex items-center justify-between mb-6">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface group-hover:text-primary group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-2xl">handshake</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<div class="inner-dot w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</div>
<h3 class="font-headline text-2xl font-medium text-on-surface mb-3">Monetizing Brand Deals</h3>
<p class="font-body text-on-surface-variant leading-relaxed text-sm">Optimize your profile for sponsorships, track conversion metrics, and manage partner deliverables.</p>
</button>
<!-- Option 4 -->
<button class="group option-card-hover text-left bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-8 flex flex-col relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer" onclick="selectOption(this)" type="button">
<div class="absolute top-0 left-0 w-1 h-full bg-transparent group-hover:bg-primary transition-colors"></div>
<div class="flex items-center justify-between mb-6">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface group-hover:text-primary group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-2xl">smart_toy</span>
</div>
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<div class="inner-dot w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</div>
<h3 class="font-headline text-2xl font-medium text-on-surface mb-3">Automating Content Production</h3>
<p class="font-body text-on-surface-variant leading-relaxed text-sm">Leverage AI generation, batch scheduling, and workflow templates to scale output efficiently.</p>
</button>
</div>
<!-- Navigation Actions -->
<div class="flex items-center justify-between mt-auto pt-8 border-t border-outline-variant/30">
<button class="font-label text-on-surface-variant hover:text-on-surface px-6 py-3 rounded-lg flex items-center space-x-2 transition-colors" type="button">
<span class="material-symbols-outlined text-sm">arrow_back</span>
<span>Back</span>
</button>
<div class="flex items-center space-x-4">
<button class="font-label text-on-surface-variant hover:text-on-surface px-6 py-3 transition-colors text-sm" type="button">
                        Skip for now
                    </button>
<button class="bg-surface-variant text-on-surface-variant font-label font-medium px-8 py-3 rounded-lg transition-all duration-300 opacity-50 cursor-not-allowed flex items-center space-x-2" disabled="" id="nextBtn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<script>
        function selectOption(selectedElement) {
            // Reset all options
            const allOptions = document.querySelectorAll('.option-card-hover');
            allOptions.forEach(opt => {
                opt.classList.remove('option-card-selected', 'border-primary', 'bg-primary/5');
                opt.classList.add('bg-surface-container-lowest', 'border-outline-variant/60');
                
                // Reset active bar
                const bar = opt.querySelector('.absolute.top-0.left-0');
                bar.classList.remove('bg-primary');
                bar.classList.add('bg-transparent');

                // Reset radio
                const radio = opt.querySelector('.radio-indicator');
                radio.classList.remove('border-primary');
                radio.classList.add('border-outline-variant');
                const dot = opt.querySelector('.inner-dot');
                dot.classList.remove('opacity-100');
                dot.classList.add('opacity-0');
                
                // Reset icon color
                const iconContainer = opt.querySelector('.w-12.h-12');
                iconContainer.classList.remove('text-primary', 'bg-primary/10');
                iconContainer.classList.add('text-on-surface', 'bg-surface-container');
            });

            // Set selected option
            selectedElement.classList.add('option-card-selected', 'border-primary', 'bg-primary/5');
            selectedElement.classList.remove('bg-surface-container-lowest', 'border-outline-variant/60');
            
            // Set active bar
            const activeBar = selectedElement.querySelector('.absolute.top-0.left-0');
            activeBar.classList.remove('bg-transparent');
            activeBar.classList.add('bg-primary');

            // Set radio
            const activeRadio = selectedElement.querySelector('.radio-indicator');
            activeRadio.classList.remove('border-outline-variant');
            activeRadio.classList.add('border-primary');
            const activeDot = selectedElement.querySelector('.inner-dot');
            activeDot.classList.remove('opacity-0');
            activeDot.classList.add('opacity-100');

            // Set icon color
            const activeIconContainer = selectedElement.querySelector('.w-12.h-12');
            activeIconContainer.classList.remove('text-on-surface', 'bg-surface-container');
            activeIconContainer.classList.add('text-primary', 'bg-primary/10');

            // Enable Next Button
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-surface-variant', 'text-on-surface-variant');
            nextBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'hover:text-on-primary-container', 'shadow-sm');
        }
    </script>
</body></html>
