<!-- Background Elements -->
<div class="fixed inset-0 z-0 pointer-events-none">
<div class="absolute top-[-20%] right-[-10%] w-[800px] h-[800px] bg-electric-purple/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-cyber-neon-green/5 rounded-full blur-[100px]"></div>

<!-- Top Nav Shell (No standard nav, just brand for onboarding) -->

<div class="font-headline-md text-headline-md font-black tracking-tighter text-electric-purple italic cursor-pointer">

            </div>
<div class="flex gap-4">
<button aria-label="Close Onboarding" class="text-on-surface-variant hover:text-hyper-cyan transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
</header>

<div class="w-full max-w-4xl w-full flex flex-col items-center">
<!-- Step Indicator -->
<div class="w-full max-w-md mx-auto mb-12">
<div class="flex justify-between items-center mb-2">
<span class="font-label-mono text-label-mono text-electric-purple">Step 2 of 4</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">Niche Details</span>
</div>
<div class="w-full bg-deep-slate h-2 rounded-full overflow-hidden border border-glass-border">

</div>
</div>

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Select your primary niche to tailor the Idea Studio and Teleprompter specifically for your audience.</p>
</div>
<!-- Niche Selection Grid -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
<!-- Category 1 -->
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="niche" type="radio" value="tech"/>
<div class="h-full bg-deep-slate rounded-xl p-6 border border-glass-border transition-all duration-300 peer-checked:border-electric-purple peer-checked:shadow-[0_0_20px_rgba(157,78,221,0.3)] peer-checked:bg-electric-purple/10 hover:border-outline-variant hover:bg-surface-container-highest">
<div class="flex flex-col items-center text-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center border border-glass-border group-hover:border-hyper-cyan/50 transition-colors peer-checked:border-electric-purple peer-checked:bg-electric-purple/20">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-hyper-cyan peer-checked:text-electric-purple peer-checked:shadow-[0_0_15px_rgba(157,78,221,0.5)]" data-icon="devices" style="font-variation-settings: 'FILL' 1;">devices</span>
</div>
<div>

<p class="font-body-md text-body-md text-on-surface-variant text-sm">Reviews, tutorials, coding, AI trends.</p>
</div>
</div>
</div>

<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-hyper-cyan peer-checked:text-electric-purple peer-checked:shadow-[0_0_15px_rgba(157,78,221,0.5)]" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>

</div>

<div class="w-full">

<input class="w-full bg-surface border border-glass-border rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-cyber-neon-green focus:ring-1 focus:ring-cyber-neon-green/50 placeholder:text-on-surface-variant/50 transition-colors" onclick="document.getElementById('custom-niche-radio').checked = true;" placeholder="Enter your niche..." type="text"/>

<div class="flex flex-col sm:flex-row gap-4 w-full max-w-md mx-auto">

                    Continue
