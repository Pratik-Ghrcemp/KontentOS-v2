<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KontentOS V2 - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#401a08",
                        "surface-tint": "#c2652a",
                        "surface-bright": "#faf5ee",
                        "tertiary": "#8c3c3c",
                        "surface-container-highest": "#e6e0d6",
                        "surface-container-high": "#ece6dc",
                        "surface-container-lowest": "#ffffff",
                        "error": "#c0392b",
                        "on-primary-container": "#fbe8d8",
                        "inverse-surface": "#3a302a",
                        "surface-container-low": "#f6f0e8",
                        "inverse-primary": "#f0a878",
                        "outline-variant": "#d8d0c8",
                        "on-surface": "#3a302a",
                        "inverse-on-surface": "#faf5ee",
                        "on-secondary-fixed": "#2a2420",
                        "secondary-fixed-dim": "#cec6be",
                        "surface-container": "#f2ece4",
                        "on-tertiary-fixed-variant": "#6e3030",
                        "tertiary-container": "#d47070",
                        "secondary-fixed": "#eae2da",
                        "on-tertiary-container": "#3a2020",
                        "on-secondary-container": "#605850",
                        "on-surface-variant": "#605850",
                        "on-error-container": "#7a1a10",
                        "primary": "#c2652a",
                        "secondary-container": "#eae2da",
                        "primary-container": "#e08850",
                        "on-tertiary-fixed": "#2e1515",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#504840",
                        "tertiary-fixed-dim": "#e8a0a0",
                        "primary-fixed-dim": "#f0a878",
                        "primary-fixed": "#fbe8d8",
                        "error-container": "#fce4e0",
                        "secondary": "#78706a",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#ece6dc",
                        "outline": "#9a9088",
                        "on-primary-fixed-variant": "#8a4518",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#3a302a",
                        "tertiary-fixed": "#fce0e0",
                        "background": "#faf5ee",
                        "surface-dim": "#dcd6cc",
                        "surface": "#faf5ee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["EB Garamond", "serif"],
                        "display": ["EB Garamond", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; background-color: #faf5ee; color: #3a302a; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'EB Garamond', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        
        /* Custom ultra-soft shadow from design system */
        .shadow-warm { box-shadow: 0 2px 16px rgba(58, 48, 42, 0.04); }
        
        /* Custom radio button styles */
        .style-radio:checked + div {
            border-color: #c2652a;
            background-color: #fbe8d8;
        }
        .style-radio:checked + div .radio-indicator {
            border-color: #c2652a;
            background-color: #c2652a;
        }
        .style-radio:checked + div .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<!-- Nav Shell Suppressed due to Onboarding Context as per strict rules -->
<!-- Content Canvas -->
<main class="flex-1 flex flex-col relative overflow-hidden">
<!-- Subtle warm background gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-bright via-surface to-surface-container-low opacity-50 z-0 pointer-events-none"></div>
<!-- Header Context -->
<header class="w-full p-8 md:p-12 z-10 flex justify-between items-center">
<div class="font-headline text-2xl font-bold text-primary tracking-tight">KontentOS V2</div>
<button class="text-on-surface-variant font-label text-sm uppercase tracking-widest hover:text-primary transition-colors flex items-center gap-2">
                Save Draft
                <span class="material-symbols-outlined text-base">save</span>
</button>
</header>
<!-- Main Onboarding Content -->
<div class="flex-1 flex flex-col items-center justify-center px-6 py-12 z-10 w-full max-w-3xl mx-auto">
<!-- Step Indicator -->
<div class="w-full mb-12 flex flex-col items-center">
<div class="font-label text-sm text-tertiary uppercase tracking-widest mb-4 font-semibold">Step 4 of 4</div>
<div class="flex gap-3 w-full max-w-xs justify-center">
<div class="h-1 flex-1 bg-primary rounded-full opacity-30"></div>
<div class="h-1 flex-1 bg-primary rounded-full opacity-30"></div>
<div class="h-1 flex-1 bg-primary rounded-full opacity-30"></div>
<div class="h-1 flex-1 bg-primary rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-primary-container to-primary w-full animate-[pulse_2s_ease-in-out_infinite]"></div>
</div>
</div>
</div>
<!-- Question Header -->
<div class="text-center mb-16 space-y-4">
<h1 class="font-headline text-4xl md:text-5xl lg:text-6xl text-on-surface leading-tight">What do you like to create?</h1>
<p class="font-body text-on-surface-variant text-lg md:text-xl max-w-xl mx-auto font-light leading-relaxed">
                    Select your primary content format. This helps us tailor your workspace and content calendar templates.
                </p>
</div>
<!-- Options Grid (Bento style for high-end UI) -->
<form class="w-full grid grid-cols-1 md:grid-cols-2 gap-6" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Option 1 -->
<label class="relative cursor-pointer group">
<input checked="" class="sr-only style-radio" name="content_style" type="radio" value="short_form"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-6 shadow-warm transition-all duration-300 hover:shadow-md hover:border-primary/50 relative overflow-hidden group-active:scale-[0.98]">
<div class="flex items-start justify-between mb-8">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-2xl">smartphone</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant radio-indicator relative transition-colors duration-200"></div>
</div>
<h3 class="font-headline text-2xl mb-2 text-on-surface group-hover:text-primary transition-colors">Short-form Vertical</h3>
<p class="font-body text-sm text-on-surface-variant">(Reels/Shorts/TikTok)</p>
<div class="absolute bottom-0 right-0 w-32 h-32 bg-primary/5 rounded-tl-full -mr-16 -mb-16 pointer-events-none"></div>
</div>
</label>
<!-- Option 2 -->
<label class="relative cursor-pointer group">
<input class="sr-only style-radio" name="content_style" type="radio" value="long_form"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-6 shadow-warm transition-all duration-300 hover:shadow-md hover:border-primary/50 relative overflow-hidden group-active:scale-[0.98]">
<div class="flex items-start justify-between mb-8">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-2xl">movie</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant radio-indicator relative transition-colors duration-200"></div>
</div>
<h3 class="font-headline text-2xl mb-2 text-on-surface group-hover:text-primary transition-colors">Long-form Video</h3>
<p class="font-body text-sm text-on-surface-variant">Deep dives &amp; tutorials</p>
<div class="absolute bottom-0 right-0 w-32 h-32 bg-primary/5 rounded-tl-full -mr-16 -mb-16 pointer-events-none"></div>
</div>
</label>
<!-- Option 3 -->
<label class="relative cursor-pointer group">
<input class="sr-only style-radio" name="content_style" type="radio" value="educational"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-6 shadow-warm transition-all duration-300 hover:shadow-md hover:border-primary/50 relative overflow-hidden group-active:scale-[0.98]">
<div class="flex items-start justify-between mb-8">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-2xl">article</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant radio-indicator relative transition-colors duration-200"></div>
</div>
<h3 class="font-headline text-2xl mb-2 text-on-surface group-hover:text-primary transition-colors">Educational Threads</h3>
<p class="font-body text-sm text-on-surface-variant">&amp; Articles</p>
<div class="absolute bottom-0 right-0 w-32 h-32 bg-primary/5 rounded-tl-full -mr-16 -mb-16 pointer-events-none"></div>
</div>
</label>
<!-- Option 4 -->
<label class="relative cursor-pointer group">
<input class="sr-only style-radio" name="content_style" type="radio" value="vlogs"/>
<div class="h-full bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-6 shadow-warm transition-all duration-300 hover:shadow-md hover:border-primary/50 relative overflow-hidden group-active:scale-[0.98]">
<div class="flex items-start justify-between mb-8">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-2xl">videocam</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant radio-indicator relative transition-colors duration-200"></div>
</div>
<h3 class="font-headline text-2xl mb-2 text-on-surface group-hover:text-primary transition-colors">Vlogs &amp; BTS</h3>
<p class="font-body text-sm text-on-surface-variant">Behind-the-Scenes</p>
<div class="absolute bottom-0 right-0 w-32 h-32 bg-primary/5 rounded-tl-full -mr-16 -mb-16 pointer-events-none"></div>
</div>
</label>
<!-- Navigation Actions -->
<div class="col-span-1 md:col-span-2 flex justify-between items-center mt-12 pt-8 border-t border-outline-variant/30">
<button class="px-6 py-3 font-label text-sm uppercase tracking-widest text-on-surface-variant hover:text-primary border border-outline-variant/60 rounded-lg transition-colors hover:border-primary" type="button">
                        Back
                    </button>
<button class="px-8 py-3 bg-primary text-on-primary font-label text-sm uppercase tracking-widest rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-warm flex items-center gap-2" type="submit">
                        Complete Setup
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer Structural Commands mapped from JSON -->
<footer class="w-full py-6 px-8 flex justify-between items-center bg-surface-bright border-t border-outline-variant/30 text-on-surface-variant z-10 relative">
<div class="font-label text-xs uppercase tracking-widest">
            © 2024 KontentOS V2 — Sun-Baked Simplicity
        </div>
<div class="flex gap-6">
<a class="font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-tertiary underline transition-all" href="#">Privacy Policy</a>
<a class="font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-tertiary underline transition-all" href="#">Terms of Service</a>
<a class="font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-tertiary underline transition-all" href="#">Creator Guidelines</a>
</div>
</footer>
</body></html>
