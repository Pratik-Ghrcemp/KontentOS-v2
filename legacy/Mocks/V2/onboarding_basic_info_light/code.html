<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>KontentOS V2 - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#401a08",
                        "surface-tint": "#c2652a",
                        "surface-bright": "#faf5ee",
                        "tertiary": "#8c3c3c",
                        "surface-container-highest": "#e6e0d6",
                        "surface-container-high": "#ece6dc",
                        "surface-container-lowest": "#ffffff",
                        "error": "#c0392b",
                        "on-primary-container": "#fbe8d8",
                        "inverse-surface": "#3a302a",
                        "surface-container-low": "#f6f0e8",
                        "inverse-primary": "#f0a878",
                        "outline-variant": "#d8d0c8",
                        "on-surface": "#3a302a",
                        "inverse-on-surface": "#faf5ee",
                        "on-secondary-fixed": "#2a2420",
                        "secondary-fixed-dim": "#cec6be",
                        "surface-container": "#f2ece4",
                        "on-tertiary-fixed-variant": "#6e3030",
                        "tertiary-container": "#d47070",
                        "secondary-fixed": "#eae2da",
                        "on-tertiary-container": "#3a2020",
                        "on-secondary-container": "#605850",
                        "on-surface-variant": "#605850",
                        "on-error-container": "#7a1a10",
                        "primary": "#c2652a",
                        "secondary-container": "#eae2da",
                        "primary-container": "#e08850",
                        "on-tertiary-fixed": "#2e1515",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#504840",
                        "tertiary-fixed-dim": "#e8a0a0",
                        "primary-fixed-dim": "#f0a878",
                        "primary-fixed": "#fbe8d8",
                        "error-container": "#fce4e0",
                        "secondary": "#78706a",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#ece6dc",
                        "outline": "#9a9088",
                        "on-primary-fixed-variant": "#8a4518",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#3a302a",
                        "tertiary-fixed": "#fce0e0",
                        "background": "#faf5ee",
                        "surface-dim": "#dcd6cc",
                        "surface": "#faf5ee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["EB Garamond", "serif"],
                        "display": ["EB Garamond", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'EB Garamond', serif; }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #faf5ee; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d8d0c8; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9a9088; 
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- SideNavBar (Suppressed for transactional onboarding screen as per Semantic Shell Mandate) -->
<!-- Navigation shell is hidden to prioritize the focused journey of onboarding. -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center min-h-screen px-6 py-12 lg:px-8 w-full max-w-7xl mx-auto">
<!-- Onboarding Container -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_2px_16px_rgba(58,48,42,0.04)] border border-outline-variant/60 p-8 md:p-12">
<!-- Header Section -->
<div class="mb-12">
<div class="flex items-center justify-between mb-4">
<span class="font-label text-sm text-on-surface-variant font-medium tracking-wide">Step 1 of 4</span>
<div class="flex gap-2">
<div class="h-1 w-8 bg-primary rounded-full"></div>
<div class="h-1 w-8 bg-surface-container-highest rounded-full"></div>
<div class="h-1 w-8 bg-surface-container-highest rounded-full"></div>
<div class="h-1 w-8 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<h1 class="font-headline text-4xl md:text-5xl font-medium text-on-background mb-4 leading-tight">Basic Info</h1>
<p class="font-body text-on-surface-variant text-lg">Let's start with the essentials to set up your workspace.</p>
</div>
<!-- Form Form -->
<form class="space-y-8">
<!-- Full Name -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface" for="full_name">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded-lg px-4 py-3 font-body text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="full_name" name="full_name" placeholder="Enter your full name" type="text">
</div>
<!-- Social Handles Section -->
<div class="space-y-6 pt-4 border-t border-outline-variant/30">
<h2 class="font-headline text-2xl text-on-background">Social Presence</h2>
<div class="space-y-4">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded-lg pl-10 pr-4 py-3 font-body text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="instagram" name="instagram" placeholder="Instagram handle (@username)" type="text">
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">play_circle</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded-lg pl-10 pr-4 py-3 font-body text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="youtube" name="youtube" placeholder="YouTube channel URL" type="text">
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">tag</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/60 rounded-lg pl-10 pr-4 py-3 font-body text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="x_handle" name="x_handle" placeholder="X (Twitter) handle (@username)" type="text">
</div>
</div>
</div>
<!-- Target Segment Dropdown -->
<div class="space-y-2 pt-4 border-t border-outline-variant/30">
<label class="block font-label text-sm font-semibold text-on-surface" for="target_segment">Target Audience Segment</label>
<p class="text-xs text-on-surface-variant mb-3 font-body">Select the primary group your content resonates with.</p>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant/60 rounded-lg px-4 py-3 font-body text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors cursor-pointer" id="target_segment" name="target_segment">
<option disabled="" selected="" value="">Select an audience segment...</option>
<option value="gen_z">Gen Z</option>
<option value="tech_professionals">Tech Professionals</option>
<option value="lifestyle_enthusiasts">Lifestyle Enthusiasts</option>
<option value="creatives">Creatives &amp; Makers</option>
<option value="b2b">B2B Founders</option>
<option value="entertainment">Entertainment</option></select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-between pt-8 mt-8 border-t border-outline-variant/30">
<button class="font-label text-on-surface-variant hover:text-primary transition-colors px-4 py-2" type="button">
                        Save Draft
                    </button>
<button class="bg-primary text-on-primary font-label font-medium px-8 py-3 rounded-lg hover:bg-on-primary-fixed-variant transition-colors shadow-sm flex items-center gap-2" type="submit">
                        Continue
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Minimal Footer for Onboarding -->
<footer class="mt-12 text-center text-xs font-label text-on-surface-variant uppercase tracking-widest">
            © 2024 KontentOS V2 — Sun-Baked Simplicity
        </footer>
</main>


</body></html>
