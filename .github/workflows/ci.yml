name: KontentOS CI & Automated Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-reality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Compilation Gate
        run: npm run typecheck

      - name: 2. Truth & Render Composition Gate
        run: npm run test:phase-25e

      - name: 3. Production Build Gate
        run: npm run build
